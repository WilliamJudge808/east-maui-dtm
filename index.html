<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>East Maui at One Metre</title>
<meta name="description" content="Predicted 1 m bare-earth terrain model of East Maui, the part of the island with no lidar coverage.">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/pmtiles@3.2.0/dist/pmtiles.js"></script>
<style>
  :root{
    --ink:#e9e7e1; --dim:#a09d95; --panel:rgba(16,20,24,.93);
    --edge:#2c3038; --reef:#5fb8a6;
  }
  html,body{margin:0;height:100%;background:#0e1418;
    font:15px/1.55 "Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--ink)}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:14px;left:14px;z-index:2;background:var(--panel);
    padding:14px 16px 12px;border:1px solid var(--edge);border-radius:5px;
    max-width:310px;backdrop-filter:blur(4px)}
  h1{font-size:16px;margin:0 0 2px;letter-spacing:-.01em}
  .sub{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--reef);margin:0 0 9px}
  p{margin:0 0 10px;color:var(--dim);font-size:12.5px}
  .ctl{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px}
  .ctl input[type=range]{flex:1;accent-color:var(--reef)}
  #status{font-size:11.5px;color:var(--dim);margin-top:9px;
    border-top:1px solid var(--edge);padding-top:8px}
  #status b{color:var(--ink);font-weight:600}
  a{color:var(--reef)}
  @media(max-width:560px){#panel{max-width:none;left:8px;right:8px;top:8px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <p class="sub">Predicted terrain &middot; not lidar</p>
  <h1>East Maui at One Metre</h1>
  <p>The wettest, steepest quarter of Maui has no lidar. This surface was
     reconstructed by a neural ensemble reading aerial imagery on top of the
     Copernicus 30&nbsp;m global DEM.</p>
  <div class="ctl"><label for="exag">Relief</label>
    <input type="range" id="exag" min="1" max="3" step="0.1" value="1.5">
    <span id="exagv">1.5&times;</span></div>
  <div class="ctl"><input type="checkbox" id="t3d" checked>
    <label for="t3d">3-D terrain (right-drag to tilt)</label></div>
  <div id="status">Loading terrain&hellip;</div>
</div>
<script>
// Tile archive. Same-origin file in this repo by default; swap to a full
// 1 m archive elsewhere by changing this one line.
const PMTILES_URL = new URL("maui_dtm_z14.pmtiles", location.href).href;
const MAX_Z = 14;                 // highest zoom present in that archive

const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const map = new maplibregl.Map({
  container: "map",
  center: [-156.10, 20.78],
  zoom: 10.6,
  pitch: 55,
  bearing: -18,
  maxPitch: 80,
  hash: true,
  style: {
    version: 8,
    sources: {
      dtm: {
        type: "raster-dem",
        url: "pmtiles://" + PMTILES_URL,
        encoding: "mapbox",        // rio rgbify -b -10000 -i 0.1
        tileSize: 512,
        maxzoom: MAX_Z,
        attribution: "Predicted DTM (not lidar) &middot; prior: Copernicus GLO-30"
      }
    },
    layers: [
      { id: "sea", type: "background", paint: { "background-color": "#0d1f26" } },
      { id: "hillshade", type: "hillshade", source: "dtm",
        paint: {
          "hillshade-exaggeration": 0.62,
          "hillshade-shadow-color": "#080b0e",
          "hillshade-highlight-color": "#f4f1ea",
          "hillshade-accent-color": "#1b2a32"
        } }
    ],
    terrain: { source: "dtm", exaggeration: 1.5 }
  }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 120, unit: "metric" }));

const statusEl = document.getElementById("status");
map.on("load", () => {
  statusEl.innerHTML = "Ready &middot; <b>9,546</b> tiles &middot; "
    + "elevation <b>&minus;26</b> to <b>3,054 m</b>";
});
map.on("error", (e) => {
  statusEl.innerHTML = "<b>Could not load tiles.</b> "
    + ((e && e.error && e.error.message) ? e.error.message : "Check PMTILES_URL.");
});

const exag = document.getElementById("exag");
const exagv = document.getElementById("exagv");
const t3d = document.getElementById("t3d");
function applyTerrain() {
  exagv.textContent = (+exag.value).toFixed(1) + "×";
  map.setTerrain(t3d.checked
    ? { source: "dtm", exaggeration: +exag.value }
    : null);
}
exag.addEventListener("input", applyTerrain);
t3d.addEventListener("change", applyTerrain);
</script>
</body>
</html>
