<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maui at One Metre</title>
<meta name="description" content="Maui's terrain at 1 m: airborne lidar where it was surveyed, a neural reconstruction where it never was. Compare either against the 30 m global DEM both start from.">
<meta name="color-scheme" content="dark">

<!-- This page is static, stores nothing, and asks for nothing. The only code
     it does not serve itself is these four files, so they are pinned by
     content hash: if the CDN ever served different bytes, the browser
     refuses to run them rather than executing whatever arrived. The CSP
     above is the second half of that -- it names the only origin allowed to
     supply script at all, and forbids this page from connecting anywhere
     except back to itself. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net blob:;
  style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
  img-src 'self' data: blob:;
  font-src 'self';
  connect-src 'self';
  worker-src blob:;
  child-src blob:;
  base-uri 'none';
  form-action 'none';">

<!-- 5.9.0 is deliberate: the last MapLibre with a UMD build, and the first
     line that carries the `color-relief` layer the elevation view uses. -->
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"
        integrity="sha384-81ppUWZZO+pveTPk4qU9cZuScEFULHfuOMHVJHFZ7xVBlWQTG1zsPrVIMGAl1WMb"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css"
      integrity="sha384-gNYNsUmuZqDYiT3gbirWTV5K7rt71RoveS/yXAaU09d4ZUmeDVTD3XoqB6uJAIFR"
      crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"
        integrity="sha384-pbKNZbDshUsLnZMIVsn/t+j3xEY9PGfuX5Z22l5rcy/obXz3EwaMx1F5d9sRsJMn"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdn.jsdelivr.net/npm/maplibre-contour@0.1.0/dist/index.min.js"
        integrity="sha384-rKd9nNV3F43xwxeA6WNNsPH+cMYQl6SEM+/HDoU/sgeuK+faXwhqXYA0Pwp0COXT"
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<style>
/* The interface is monochrome on purpose. The only saturated colour on this
   page is data -- the survey boundary and the elevation ramp -- so colour
   always means something rather than decorating something. */
:root{
  --ink:#e6e2d9; --dim:#8b9299; --faint:#575e64;
  --panel:#0c1013; --edge:#222a2f;
  /* --sea is sampled, not chosen: it is exactly what a flat 0 m tile renders
     as through the relief ramp and hillshade. The page background, the map's
     background layer and the tiled ocean must all be this same value, or the
     rectangular edge of the archive shows up as a box floating in the sea. */
  --line:#7fe3c8; --warn:#c9973f; --sea:#0d1d23;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--sea);color:var(--ink);
  font:13px/1.45 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
#map{position:absolute;inset:0}

/* MapLibre's own controls ship rounded and white; square and darken them so
   they belong to the same instrument as everything else. */
.maplibregl-ctrl-group,.maplibregl-ctrl-group button,.maplibregl-ctrl-scale,
.maplibregl-ctrl-attrib,.maplibregl-ctrl-attrib-button{border-radius:0!important}
.maplibregl-ctrl-group{background:var(--panel);border:1px solid var(--edge);
  box-shadow:none}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--edge)}
.maplibregl-ctrl-group button .maplibregl-ctrl-icon{filter:invert(.82)}
.maplibregl-ctrl-scale{background:var(--panel);border:1px solid var(--edge);
  border-top:0;color:var(--dim);font:11px/1.6 var(--mono)}
.maplibregl-ctrl-attrib{background:var(--panel);color:var(--dim);font-size:10.5px}
.maplibregl-ctrl-attrib a{color:var(--dim)}

/* ---- panel ---- */
#hud{position:absolute;top:12px;left:12px;z-index:3;width:262px;
  background:var(--panel);border:1px solid var(--edge)}
#head{display:flex;align-items:baseline;gap:10px;padding:11px 12px 10px;
  cursor:pointer;user-select:none}
#head h1{font-size:15px;margin:0;letter-spacing:-.01em;font-weight:600}
#head .chev{margin-left:auto;color:var(--faint);font-size:10px;flex:none;
  background:none;border:0;cursor:pointer;padding:0;font-family:inherit}
#head .chev:hover{color:var(--ink)}
#hud.shut .chev{transform:rotate(-90deg)}
#hud.shut #body{display:none}
#body{padding:0 12px 11px}
#body>p{margin:0 0 12px;color:var(--dim);font-size:12px;line-height:1.5}

.grp{margin-bottom:11px}
.lab{font-size:11px;color:var(--faint);margin-bottom:4px;display:flex;gap:6px;
  align-items:baseline}
.lab .hint{margin-left:auto;font-size:10.5px}
.seg{display:flex;border:1px solid var(--edge)}
.seg button{flex:1;appearance:none;background:none;border:0;color:var(--dim);
  font:inherit;font-size:11.5px;padding:5px 3px;cursor:pointer;
  white-space:nowrap}
.seg button+button{border-left:1px solid var(--edge)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--panel);
  font-weight:600}

.row{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--faint);
  margin-top:7px}
.row input[type=range]{flex:1;accent-color:var(--dim);height:2px}
.row .val{width:32px;text-align:right;color:var(--ink);font:11px var(--mono)}
label.chk{display:flex;align-items:center;gap:7px;font-size:12px;
  color:var(--dim);cursor:pointer;margin-top:7px}
label.chk input{accent-color:var(--dim);margin:0}

#foot{border-top:1px solid var(--edge);padding:8px 12px 9px;
  font:10.5px var(--mono);color:var(--faint)}
#foot b{color:var(--dim);font-weight:400}
#foot .err{color:var(--warn)}

/* ---- cursor readout ---- */
#read{position:absolute;top:12px;right:52px;z-index:3;background:var(--panel);
  border:1px solid var(--edge);padding:6px 9px;min-width:112px;text-align:right;
  opacity:0;pointer-events:none}
#read.on{opacity:1}
#read .m{font:17px/1.1 var(--mono);letter-spacing:-.02em}
#read .m small{font-size:10px;color:var(--faint);margin-left:2px}
#read .src{font-size:10px;color:var(--faint);margin-top:2px}
#read .src.pred{color:var(--warn)}
#read .src.surv{color:var(--line)}

/* ---- legend ---- */
/* clears the scale bar, which MapLibre pins to the bottom-left corner */
#leg{position:absolute;left:12px;bottom:38px;z-index:3;background:var(--panel);
  border:1px solid var(--edge);padding:8px 10px 7px;width:262px}
#ramp{height:7px;border:1px solid var(--edge)}
#ticks{display:flex;justify-content:space-between;font:9.5px var(--mono);
  color:var(--faint);margin-top:3px}
#keys{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;
  color:var(--faint);margin-top:7px;padding-top:7px;
  border-top:1px solid var(--edge)}
/* `hidden` alone cannot beat the id rule that sets #ticks to flex. */
#leg.noramp #ramp,#leg.noramp #ticks{display:none}
#leg.noramp #keys{margin-top:0;padding-top:0;border-top:0}
#keys span{display:flex;align-items:center;gap:6px}
#keys b{color:var(--dim);font-weight:400}
#keys i{width:16px;height:0;flex:none;display:inline-block;
  border-top:1px dashed var(--line)}

@media(max-width:640px){
  #hud,#leg{width:auto;left:8px;right:8px}
  #hud{top:8px} #leg{bottom:32px} #read{top:auto;bottom:128px;right:8px}
}
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div id="head">
    <h1>Maui at One Metre</h1>
    <button class="chev" id="chev" aria-expanded="true"
            aria-label="Collapse panel">&#9660;</button>
  </div>
  <div id="body">
    <p>East Maui has no lidar. That third is reconstructed from aerial
       imagery over a 30&nbsp;m global DEM.</p>

    <div class="grp">
      <div class="lab">surface <span class="hint">space to flip</span></div>
      <div class="seg" id="src">
        <button data-v="surface" aria-pressed="true">1 m</button>
        <button data-v="prior" aria-pressed="false">Copernicus 30 m</button>
      </div>
    </div>

    <div class="grp">
      <div class="lab">view</div>
      <div class="seg" id="view">
        <button data-v="relief" aria-pressed="true">Relief</button>
        <button data-v="elev" aria-pressed="false">Elevation</button>
        <button data-v="contour" aria-pressed="false">Contours</button>
      </div>
    </div>

    <div class="row"><span>relief</span>
      <input type="range" id="exag" min="1" max="3" step="0.1" value="1.6">
      <span class="val" id="exagv">1.6&times;</span></div>
    <label class="chk"><input type="checkbox" id="t3d" checked>3-D terrain</label>
    <label class="chk"><input type="checkbox" id="tcov" checked>Survey outline</label>
  </div>
  <div id="foot">loading&hellip;</div>
</div>

<div id="read">
  <div class="m"><span id="rm">&mdash;</span><small>m</small></div>
  <div class="src" id="rs">&nbsp;</div>
</div>

<div id="leg">
  <div id="ramp"></div>
  <div id="ticks"></div>
  <div id="keys">
    <span><i></i>survey&nbsp;edge</span>
    <span>outside: <b>modelled</b></span>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ data --
 * Both archives are ordinary PMTiles. The ".png" suffix is load-bearing:
 * GitHub Pages gzip-encodes application/octet-stream and then applies HTTP
 * Range to the COMPRESSED stream, so every PMTiles byte offset lands in the
 * wrong place. Files served as image/* are passed through untouched.
 */
const ARCHIVES = {
  surface: {
    // Tiles inside are lossless WebP, ~30% smaller than PNG for identical
    // pixels -- which is what keeps the archive under GitHub's 100 MiB limit.
    // z15 exists over the model's footprint only -- 2.24 m/px, essentially
    // the native grid. PMTiles is sparse and MapLibre falls back to the
    // parent tile, so the lidar simply tops out one level earlier.
    file: "maui_surface_z15.pmtiles.png", maxzoom: 15, mime: "image/webp",
    name: "1 m surface", attrib:
      "Lidar: NOAA 2022 topobathy &middot; East Maui: modelled, not measured "
      + "&middot; produced using Copernicus WorldDEM-30 &copy; DLR e.V. "
      + "2010-2014 and &copy; Airbus Defence and Space GmbH 2014-2018 "
      + "provided under COPERNICUS by the European Union and ESA; "
      + "all rights reserved",
  },
  prior: {
    file: "maui_prior_z12.pmtiles.png", maxzoom: 12, mime: "image/png",
    // Art. 6(a) of the Copernicus DEM licence: this layer IS the data, so it
    // carries the source notice. The surface above is adapted from it, so it
    // carries the Art. 6(b) "produced using" notice instead. Both are
    // prescribed verbatim -- they are an obligation, not a courtesy credit.
    name: "Copernicus GLO-30", attrib:
      "&copy; DLR e.V. 2010-2014 and &copy; Airbus Defence and Space GmbH "
      + "2014-2018 provided under COPERNICUS by the European Union and ESA; "
      + "all rights reserved",
  },
};
// Framing box, not the data box. Kahoolawe is in the archive and shows up in
// the corner, but including its latitude here pushed fitBounds two zoom levels
// out and left the island swimming in empty ocean.
const MAUI = [[-156.70, 20.575], [-155.97, 21.035]];

/* Sea is written as elevation 0, so it is the ramp's first stop rather than a
 * separate layer. The two views then differ only in this table. */
const RAMPS = {
  relief: [0,"#0a1a21", 0.4,"#12313c", 0.8,"#4c5850", 900,"#5f6255",
           2400,"#6d6a5e", 3100,"#807a6c"],
  elev:   [0,"#0a1a21", 0.4,"#0e2630", 0.8,"#1b4d3a", 250,"#2f6b3c",
           650,"#5c8340", 1100,"#93964a", 1600,"#bb9552", 2100,"#c07f55",
           2600,"#ab6154", 3055,"#e3d9cf"],
};
// maplibre-contour picks the largest key <= the tile's zoom, so a missing low
// entry is not a coarser contour -- it is no contour at all. A tilted view
// draws its far half from z8-z9 tiles, which is why the top of the screen came
// up bare until 8 and 9 were added here.
const CONTOURS = {
  8:[1000,3000], 9:[500,2000], 10:[250,1000], 11:[100,500],
  12:[50,250], 13:[25,100], 14:[10,50], 15:[10,50],
};

/* ------------------------------------------------------------- pmtiles --- */
const protocol = new pmtiles.Protocol();
maplibregl.addProtocol("pmtiles", protocol.tile);

const readers = {};
for (const [key, cfg] of Object.entries(ARCHIVES)) {
  cfg.url = new URL(cfg.file, location.href).href;
  readers[key] = new pmtiles.PMTiles(cfg.url);
  protocol.add(readers[key]);          // share one reader (and its cache)
}

/* maplibre-contour fetches DEM tiles with a plain fetch() that knows nothing
 * about pmtiles://. Rather than publish a second, unpacked copy of every tile
 * just for the contour view, route its requests back into the same reader the
 * map is already using -- same archive, same warm byte ranges, no extra
 * bytes hosted. The host is unresolvable, so nothing can leak to the network. */
const DEM_SCHEME = "https://pmtiles.invalid/";
const nativeFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const url = typeof input === "string" ? input : input.url;
  if (typeof url !== "string" || !url.startsWith(DEM_SCHEME)) {
    return nativeFetch(input, init);
  }
  const [key, z, x, y] = url.slice(DEM_SCHEME.length).split("/");
  const tile = await readers[key].getZxy(+z, +x, +y);
  if (tile) {
    return new Response(tile.data,
      { status: 200, headers: { "Content-Type": ARCHIVES[key].mime } });
  }
  // A 404 here is ordinary -- the archive is island-shaped and the contour
  // plugin still asks for the ocean around it -- but the plugin reports it as
  // a map error, which lands in the status line. Hand back a tile that is
  // flat sea instead: no isoline is drawn below the 10 m threshold anyway.
  return new Response(await blankDem(),
    { status: 200, headers: { "Content-Type": "image/png" } });
};

let blankPromise = null;
function blankDem() {
  if (!blankPromise) {
    const c = document.createElement("canvas");
    c.width = c.height = 1;
    const g = c.getContext("2d");
    g.fillStyle = "rgb(1,134,160)";     // terrain-RGB for exactly 0 m:
    g.fillRect(0, 0, 1, 1);             // (1*65536 + 134*256 + 160)*0.1 - 10000
    blankPromise = new Promise((res) => c.toBlob(res, "image/png"));
  }
  return blankPromise;
}

const demSources = {};
function demSource(key) {
  if (!demSources[key]) {
    const d = new mlcontour.DemSource({
      url: DEM_SCHEME + key + "/{z}/{x}/{y}",
      encoding: "mapbox",
      maxzoom: ARCHIVES[key].maxzoom,
      worker: false,                 // the shim above lives on this thread
      id: "dem-" + key,
    });
    d.setupMaplibre(maplibregl);
    demSources[key] = d;
  }
  return demSources[key];
}

/* ----------------------------------------------------------------- map --- */
const state = { src: "surface", view: "relief", exag: 1.6, d3: true, cov: true };

const map = new maplibregl.Map({
  container: "map",
  bounds: MAUI,
  fitBoundsOptions: { padding: 12 },
  pitch: 44,
  bearing: -14,
  maxPitch: 80,
  minZoom: 8.4,
  // With tileSize 256 the deepest tiles are already in use at screen z14;
  // past ~16 there is nothing left to show but interpolation.
  maxZoom: 16,
  maxBounds: [[-157.35, 20.05], [-155.35, 21.5]],
  hash: true,
  attributionControl: false,       // re-added below, compact
  // Pages sends max-age=600 on every tile. Without this MapLibre re-requests
  // each one the moment it expires, mid-pan, for bytes that never change.
  refreshExpiredTiles: false,
  style: {
    version: 8,
    sources: Object.fromEntries(Object.entries(ARCHIVES).map(([k, c]) => [k, {
      type: "raster-dem", url: "pmtiles://" + c.url, encoding: "mapbox",
      // The tiles really are 512 px. Declaring 256 only changes which zoom
      // MapLibre reaches for at a given camera -- one level deeper, so the
      // hillshade is computed from twice as fine a DEM. Measured at the
      // default view: 1.53x the high-frequency detail for 2.1x the bytes,
      // with elevations bit-identical (checked against Haleakala and Puu
      // Kukui). Elevation decoding reads the real image dimensions, so
      // nothing about the terrain geometry depends on this number.
      tileSize: 256, maxzoom: c.maxzoom, attribution: c.attrib,
    }])),
    layers: [{ id: "sea", type: "background",
               // Must equal --sea in the stylesheet; see the note there.
               paint: { "background-color": "#0d1d23" } }],
  },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "top-right");
map.addControl(new maplibregl.ScaleControl({ maxWidth: 110, unit: "metric" }));
// Compact: the Copernicus notices are prescribed verbatim and long enough to
// span the window, which collided with the legend. Collapsed behind the "i"
// is how web maps normally carry a required notice, and it is also stated in
// full in the README.
map.addControl(new maplibregl.AttributionControl({ compact: true }));

/* Layers are rebuilt rather than retargeted, because a layer's source is
 * fixed at creation. Only the active archive ever has a layer pointing at it,
 * so the inactive one costs no requests. */
const MINE = ["tint", "shade", "cmin", "cmaj", "cov-glow", "cov-line"];

function paintRamp(view) {
  const stops = RAMPS[view === "elev" ? "elev" : "relief"];
  return ["interpolate", ["linear"], ["elevation"], ...stops];
}

function rebuild() {
  for (const id of MINE) if (map.getLayer(id)) map.removeLayer(id);
  if (map.getSource("contours")) map.removeSource("contours");

  const src = state.src;

  map.addLayer({
    id: "tint", type: "color-relief", source: src,
    paint: { "color-relief-color": paintRamp(state.view),
             "color-relief-opacity": 1 },
  });
  map.addLayer({
    id: "shade", type: "hillshade", source: src,
    paint: {
      // 0.72 with a near-white highlight blew the sunlit faces out to paper.
      "hillshade-exaggeration": state.view === "elev" ? 0.42 : 0.55,
      "hillshade-shadow-color": "#05090d",
      "hillshade-highlight-color": "#e6dcc6",
      "hillshade-accent-color": "#14313b",
    },
  });

  if (state.view === "contour") {
    map.addSource("contours", {
      type: "vector", maxzoom: 15,
      tiles: [demSource(src).contourProtocolUrl({
        thresholds: CONTOURS, contourLayer: "c", elevationKey: "ele",
        levelKey: "level",
      })],
    });
    map.addLayer({
      id: "cmin", type: "line", source: "contours", "source-layer": "c",
      filter: ["!=", ["get", "level"], 1],
      paint: { "line-color": "#efe6d4", "line-width": 0.5,
               "line-opacity": 0.34 },
    });
    map.addLayer({
      id: "cmaj", type: "line", source: "contours", "source-layer": "c",
      filter: ["==", ["get", "level"], 1],
      paint: { "line-color": "#f6eeda", "line-width": 1.05,
               "line-opacity": 0.62 },
    });
  }

  if (map.getSource("coverage")) {
    // A 1 px half-transparent dash disappeared into the hillshade. A soft
    // wide glow under a crisp dash reads at every zoom without hiding relief.
    const vis = { visibility: state.cov ? "visible" : "none" };
    map.addLayer({
      id: "cov-glow", type: "line", source: "coverage", layout: vis,
      paint: { "line-color": "#5fc0a8", "line-blur": 3,
               "line-opacity": 0.3,
               "line-width": ["interpolate", ["linear"], ["zoom"],
                              9, 5, 13, 10] },
    });
    map.addLayer({
      id: "cov-line", type: "line", source: "coverage", layout: vis,
      paint: { "line-color": "#8af0d4", "line-opacity": 0.95,
               "line-dasharray": [3, 2],
               "line-width": ["interpolate", ["linear"], ["zoom"],
                              9, 1.5, 13, 2.4] },
    });
  }

  map.setTerrain(state.d3 ? { source: src, exaggeration: state.exag } : null);
  drawLegend();
  collapseAttrib();
}

/* MapLibre renders the compact attribution pre-expanded, and these notices are
 * long enough to span the window and sit on top of the legend. Collapse it to
 * the "i" -- the notice is still one click away, and in the README. Repeated
 * after every rebuild because switching source rewrites the attribution. */
function collapseAttrib() {
  for (const el of document.querySelectorAll("details.maplibregl-ctrl-attrib")) {
    el.open = false;
    el.classList.remove("maplibregl-compact-show");
  }
}

/* ------------------------------------------------------------ coverage --- */
let coverage = null;                     // rings in lng/lat, for the readout
fetch("lidar_coverage.geojson")
  .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
  .then((gj) => {
    coverage = [];
    for (const f of gj.features) {
      const polys = f.geometry.type === "Polygon"
        ? [f.geometry.coordinates] : f.geometry.coordinates;
      for (const p of polys) coverage.push(p);
    }
    // addSource throws outright if the style has not finished loading, and
    // this fetch can easily win that race on a warm cache.
    const attach = () => { map.addSource("coverage", { type: "geojson", data: gj }); rebuild(); };
    if (map.isStyleLoaded()) attach(); else map.once("load", attach);
  })
  .catch(() => { /* outline is optional; the map stands without it */ });

function surveyed(lng, lat) {
  if (!coverage) return null;
  for (const rings of coverage) {
    let inside = false;
    for (let r = 0; r < rings.length; r++) {
      let hits = false;
      const ring = rings[r];
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const [xi, yi] = ring[i], [xj, yj] = ring[j];
        if ((yi > lat) !== (yj > lat) &&
            lng < ((xj - xi) * (lat - yi)) / (yj - yi) + xi) hits = !hits;
      }
      if (r === 0) { if (!hits) break; inside = true; }
      else if (hits) { inside = false; break; }   // hole
    }
    if (inside) return true;
  }
  return false;
}

/* -------------------------------------------------------------- legend --- */
function drawLegend() {
  // Only the elevation view encodes height as colour, so only it earns a
  // ramp; in the other views the same bar was a meaningless grey smear.
  const show = state.view === "elev";
  ramp.hidden = ticks.hidden = !show;
  $("leg").classList.toggle("noramp", !show);
  if (!show) return;
  const stops = RAMPS.elev;
  const max = stops[stops.length - 2];
  const parts = [];
  for (let i = 0; i < stops.length; i += 2) {
    parts.push(`${stops[i + 1]} ${((stops[i] / max) * 100).toFixed(2)}%`);
  }
  ramp.style.background = `linear-gradient(90deg,${parts.join(",")})`;
  ticks.innerHTML = [0, 1000, 2000, 3000]
    .map((v, i) => `<span>${v.toLocaleString()}${i === 3 ? " m" : ""}</span>`)
    .join("");
}

/* ----------------------------------------------------------- interface --- */
const $ = (id) => document.getElementById(id);
const foot = $("foot"), ramp = $("ramp"), ticks = $("ticks");

function seg(id, key) {
  $(id).addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b && !b.disabled) setSeg(id, key, b.dataset.v);
  });
}
function setSeg(id, key, v) {
  if (state[key] === v) return;
  state[key] = v;
  for (const b of $(id).querySelectorAll("button")) {
    b.setAttribute("aria-pressed", String(b.dataset.v === v));
  }
  rebuild();
  status();
}
seg("src", "src");
seg("view", "view");

$("exag").addEventListener("input", (e) => {
  state.exag = +e.target.value;
  $("exagv").textContent = state.exag.toFixed(1) + "×";
  if (state.d3) map.setTerrain({ source: state.src, exaggeration: state.exag });
});
$("t3d").addEventListener("change", (e) => {
  state.d3 = e.target.checked;
  map.setTerrain(state.d3 ? { source: state.src, exaggeration: state.exag } : null);
  if (!state.d3) $("read").classList.remove("on");
});
$("tcov").addEventListener("change", (e) => {
  state.cov = e.target.checked;
  for (const id of ["cov-glow", "cov-line"]) {
    if (map.getLayer(id)) {
      map.setLayoutProperty(id, "visibility", state.cov ? "visible" : "none");
    }
  }
});
$("head").addEventListener("click", () => {
  const shut = $("hud").classList.toggle("shut");
  const c = $("chev");
  c.setAttribute("aria-expanded", String(!shut));
  c.setAttribute("aria-label", (shut ? "Expand" : "Collapse") + " panel");
});
addEventListener("keydown", (e) => {
  if (e.key !== " " || e.target.matches("input,button")) return;
  e.preventDefault();
  setSeg("src", "src", state.src === "surface" ? "prior" : "surface");
});

/* Elevation under the cursor. This is what makes the A/B quantitative: park
 * the pointer on a ridge, press space, watch the number move. */
let pending = null, queued = false;
map.on("mousemove", (e) => {
  if (!state.d3) return;
  pending = e.lngLat;
  if (queued) return;               // one frame's work per frame, not per event
  queued = true;
  requestAnimationFrame(() => {
    queued = false;
    const ll = pending; pending = null;
    if (!ll) return;
    const z = map.queryTerrainElevation(ll);
    if (z == null) { $("read").classList.remove("on"); return; }
    // queryTerrainElevation returns the *exaggerated* height, so at 1.6x this
    // was reporting Haleakala as 4,888 m. Divide it back out.
    $("rm").textContent = Math.round(z / state.exag).toLocaleString();
    const s = surveyed(ll.lng, ll.lat);
    const el = $("rs");
    el.className = "src " + (state.src === "prior" ? "" : s ? "surv" : "pred");
    el.textContent = state.src === "prior" ? "global DEM"
      : s === null ? " " : s ? "surveyed" : "modelled";
    $("read").classList.add("on");
  });
});
map.on("mouseout", () => $("read").classList.remove("on"));

function status() {
  const c = ARCHIVES[state.src];
  // Ground sampling at the archive's top zoom, so the panel never implies
  // more detail on screen than the tiles actually carry.
  const mpx = (40075017 * Math.cos(20.8 * Math.PI / 180))
              / (Math.pow(2, c.maxzoom) * 512);
  foot.innerHTML = `<b>${c.name}</b>  z${c.maxzoom}  ${mpx.toFixed(1)} m/px`;
}

map.on("load", () => { rebuild(); status(); });
map.on("error", (e) => {
  const m = (e && e.error && e.error.message) || "unknown";
  foot.innerHTML = `<span class="err">Tile error.</span> ${m}`;
});
</script>
</body>
</html>
